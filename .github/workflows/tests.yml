name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -e . pytest pyyaml

      - run: python -m pytest tests -q

      - name: Smoke-test the installed entry point
        run: |
          set -euo pipefail
          mkdir -p work/tests && cd work
          export PYTHONPATH=.   # stands in for the caller's own setup step
          printf 'def divide(x, y):\n    return x / y\n' > app.py
          cat > tests/test_divide.py <<'PY'
          import pytest
          from app import divide

          @pytest.mark.llm_fuzz(budget_usd=0.05)
          def test_divide(llm_fuzz_case):
              """Division must not leak a raw ZeroDivisionError."""
              try:
                  result = divide(**llm_fuzz_case.input)
              except ZeroDivisionError:
                  pytest.fail("divide should handle y=0")
              assert result is None or isinstance(result, (int, float))
          PY
          llm-fuzz-ci collect tests
          grep -q "tests/test_divide.py::test_divide" .llm-fuzz/targets.json
          mkdir -p .llm-fuzz/cases
          printf '{"target_id": "tests/test_divide.py::test_divide", "input": {"x": 1, "y": 0}, "rationale": "Zero divisor."}\n' \
            > ".llm-fuzz/cases/tests-test_divide.py-test_divide.jsonl"
          llm-fuzz-ci test-fuzz-cases --require-cases -- tests -q || true
          llm-fuzz-ci summary --output report.md
          grep -q "1 of 1 tested inputs failed" report.md

      - name: Collecting nothing is an error, not a green run
        run: |
          set -euo pipefail
          mkdir -p empty/tests && cd empty
          echo "def test_plain(): assert True" > tests/test_plain.py
          if llm-fuzz-ci collect tests; then
            echo "collect should have failed with no marked tests"; exit 1
          fi

      - name: Check every workflow and action parses
        run: |
          python - <<'PY'
          import pathlib, re, yaml
          for path in list(pathlib.Path(".").rglob("*.yml")) + list(pathlib.Path(".").rglob("action.yml")):
              yaml.safe_load(path.read_text())
          for doc in pathlib.Path("templates").glob("*.md"):
              for block in re.findall(r"```yaml\n(.*?)```", doc.read_text(), re.S):
                  yaml.safe_load(block)
          print("ok")
          PY

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: python -m pip install -e .

      - name: Smoke-test the vitest runner end to end
        run: |
          set -euo pipefail
          mkdir -p work/tests && cd work
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-audit --no-fund --silent vitest "file:$GITHUB_WORKSPACE"

          cat > redirect.mjs <<'JS'
          export function isSafeRedirect(url) {
            return !String(url).startsWith("http://");
          }
          JS
          cat > tests/redirect.fuzz.test.mjs <<'JS'
          import { expect } from "vitest";
          import { fuzzTest } from "llm-fuzz-ci";
          import { isSafeRedirect } from "../redirect.mjs";

          fuzzTest("only relative paths are safe", { budgetUsd: 0.05, params: ["url"] }, (input) => {
            if (!isSafeRedirect(input.url)) return;
            expect(String(input.url).startsWith("/")).toBe(true);
          });
          JS
          cat > tests/ordinary.test.mjs <<'JS'
          import { test, expect } from "vitest";
          test("an ordinary neighbour", () => {
            console.log("EXECUTED_ORDINARY_TEST");
            expect(1).toBe(1);
          });
          JS

          # Unpinned on purpose: this job is how a new vitest major gets
          # noticed. vitest 5 stopped executing module scope under `list`, and
          # that is exactly the kind of change that has to fail here first.
          ./node_modules/.bin/vitest --version

          llm-fuzz-ci collect tests | tee collect.log
          grep -q "tests/redirect.fuzz.test.mjs::only relative paths are safe" .llm-fuzz/targets.json
          # collection must not run the neighbouring suite
          if grep -q EXECUTED_ORDINARY_TEST collect.log; then
            echo "collect executed an unrelated test"; exit 1
          fi

          mkdir -p .llm-fuzz/cases
          printf '%s\n' \
            '{"target_id": "tests/redirect.fuzz.test.mjs::only relative paths are safe", "input": {"url": "\\evil.com"}, "rationale": "Backslash is not http:// but browsers follow it."}' \
            > ".llm-fuzz/cases/tests-redirect.fuzz.test.mjs-only-relative-paths-are-safe.jsonl"

          llm-fuzz-ci test-fuzz-cases --require-cases -- tests || true
          llm-fuzz-ci summary --output report.md
          cat report.md
          grep -q "1 of 1 tested inputs failed" report.md
