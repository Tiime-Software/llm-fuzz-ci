# Copy to .github/workflows/llm-fuzz-ci.yml and edit the lines marked EDIT ME.
# Everything else has a working default.

name: LLM Fuzz CI

on:
  # Run it by hand from the Actions tab while you are setting it up.
  workflow_dispatch:

  # Once it works, uncomment one of these.
  # schedule:
  #   - cron: "17 2 * * *"   # nightly at 02:17 UTC
  # pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # EDIT ME — set your project up however you normally do. Poetry, uv, a
      # Makefile, extra services: anything works. If pytest or vitest can import
      # your code after these steps, so can the agent.
      #
      # For a Node project add actions/setup-node and `npm ci` here as well.
      - run: pip install -e .

      - uses: Tiime-Software/llm-fuzz-ci@v1
        with:
          # EDIT ME — where your marked tests live.
          test-paths: tests

          # codex (default) or claude.
          agent: codex
          # EDIT ME — pin the model, so the prices below always match it.
          model: gpt-6-astra

          # Match the key to the agent:
          #   codex  -> openai-api-key, or openrouter-api-key with provider: openrouter
          #   claude -> anthropic-api-key
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

          # Another model through OpenRouter: replace the openai-api-key line
          # above with these.
          # provider: openrouter
          # model: mistralai/mistral-large-4-0
          # openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

          # Codex counts tokens, not dollars. To enforce each test's budget_usd
          # it needs the model's prices, in USD per million tokens. Without them
          # a Codex run with a budget stops before any agent starts.
          # EDIT ME — these are the listed prices of gpt-6-astra, September 2026.
          # For Mistral Large 4 use "0.68" and "2.09".
          price-input-per-million: "10.00"
          price-output-per-million: "50.00"

      - uses: actions/upload-artifact@v7
        with:
          name: llm-fuzz-ci-cases
          include-hidden-files: true
          path: .llm-fuzz
          retention-days: 1

  test:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # only needed when --create-issue is passed

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # EDIT ME — the same setup as the generate job.
      - run: pip install -e .

      # No action runs here, so the pytest plugin and the CLI are not installed.
      - run: pip install "git+https://github.com/Tiime-Software/llm-fuzz-ci.git@v1"

      - uses: actions/download-artifact@v7
        with:
          name: llm-fuzz-ci-cases
          path: .llm-fuzz

      # Your own test command. The plugin reads .llm-fuzz/cases; `-m llm_fuzz`
      # keeps this to the marked tests, so an unrelated failure cannot redden a
      # fuzz run.  EDIT ME for Node:  npx vitest run .fuzz.
      - run: pytest tests -m llm_fuzz
        continue-on-error: true

      # Summary on the run page, an issue, and the exit code.
      # Drop --create-issue or --hard-fail to turn either off.
      - run: llm-fuzz-ci report --create-issue --hard-fail
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: llm-fuzz-ci
          include-hidden-files: true
          path: |
            .llm-fuzz
            !.llm-fuzz/reports/vitest-results
